<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off the board</title>
<meta name="robots" content="noindex">
<style>
  :root { --felt: #3B2F9E; --ink: #1C1747; --sun: #FFC22E; --tomato: #FF5A36; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: Gabarito, ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink);
    background: radial-gradient(120% 90% at 50% 20%, #4B3FBC 0%, var(--felt) 50%, #2A2180 100%);
  }
  .card {
    max-width: 460px; width: 100%; text-align: center; padding: 40px 32px 36px;
    background: var(--sun); border: 3px solid var(--ink); border-radius: 24px;
    box-shadow: 0 12px 0 #D99A00, 0 12px 0 3px var(--ink); transform: rotate(-1.5deg);
  }
  .die { width: 84px; height: 84px; margin: 0 auto 20px; background: #fff; border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink); display: grid; place-items: center; transform: rotate(12deg); }
  .die i { width: 20px; height: 20px; border-radius: 50%; background: var(--tomato); border: 2px solid var(--ink); }
  h1 { font-family: Shrikhand, Georgia, serif; font-weight: 400; font-size: 40px; line-height: 1; margin: 0 0 12px; text-shadow: 2px 2px 0 var(--tomato); }
  p { font-size: 18px; line-height: 1.45; margin: 0 0 24px; }
  a { display: inline-block; padding: 14px 24px; border-radius: 999px; background: var(--tomato); color: var(--ink); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); font-weight: 800; font-size: 17px; text-decoration: none; }
  a:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
</style>
</head>
<body>
  <main class="card">
    <div class="die" aria-hidden="true"><i></i></div>
    <h1>You rolled off the board.</h1>
    <p>This page doesn't exist. The game's still waiting where you left it.</p>
    <a id="home" href="/">Back to the board</a>
  </main>
  <script>
    // On a GitHub project page (username.github.io/repo/), home is /repo/
    var seg = location.pathname.split('/')[1];
    if (/\.github\.io$/.test(location.hostname) && seg && seg.indexOf('.') === -1) {
      document.getElementById('home').href = '/' + seg + '/';
    }
    // borrow the site's own typefaces
    var base = document.getElementById('home').getAttribute('href');
    var s = document.createElement('style');
    s.textContent = "@font-face{font-family:Shrikhand;src:url('" + base + "assets/fonts/shrikhand-latin-400-normal.woff2') format('woff2')}" +
      "@font-face{font-family:Gabarito;font-weight:500;src:url('" + base + "assets/fonts/gabarito-latin-500-normal.woff2') format('woff2')}" +
      "@font-face{font-family:Gabarito;font-weight:800;src:url('" + base + "assets/fonts/gabarito-latin-800-normal.woff2') format('woff2')}";
    document.head.appendChild(s);
  </script>
</body>
</html>
