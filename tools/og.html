<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>Share image</title>
<!--
  This page draws the 1200 × 630 image that appears when the portfolio link
  is shared (LinkedIn, iMessage, Slack, WhatsApp...).

  Open it in Chrome at  tools/og.html          (generic version)
                    or  tools/og.html?named   (uses the name in js/content.js)
  Then: right-click > Inspect > Ctrl/Cmd+Shift+P > "Capture node screenshot"
  on the <div id="og"> element, and save it over assets/og-image.png
-->
<link rel="stylesheet" href="../css/style.css">
<style>
  html, body { margin: 0; background: #222; }
  #og {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background-color: var(--felt);
    background-image: var(--noise), radial-gradient(120% 90% at 50% 20%, var(--felt-hi) 0%, var(--felt) 48%, var(--felt-lo) 100%);
    display: grid; place-items: center;
  }
  .og-lid {
    position: relative; width: 1060px; height: 500px; box-sizing: border-box;
    padding: 46px 56px;
    background-color: var(--sun);
    background-image: radial-gradient(circle, rgba(255,255,255,.28) 1.6px, transparent 2px);
    background-size: 18px 18px;
    border: 4px solid var(--ink); border-radius: 30px;
    box-shadow: 0 16px 0 0 var(--sun-deep), 0 16px 0 4px var(--ink), 0 40px 60px -10px rgba(8,4,40,.6);
    transform: rotate(-1.6deg);
    display: grid; grid-template-columns: 1fr 360px; align-items: center; gap: 24px;
    color: var(--ink); font-family: var(--f-ui);
  }
  .og-badges { display: flex; gap: 10px; margin-bottom: 22px; }
  .og-badges span { font-weight: 800; font-size: 20px; padding: 8px 16px; border-radius: 999px; background: #fff; border: 3px solid var(--ink); }
  .og-title { font-family: var(--f-display); font-size: 74px; line-height: .98; text-shadow: .05em .05em 0 var(--tomato); margin: 0; }
  .og-ribbon { display: inline-block; margin-top: 26px; font-weight: 900; font-size: 30px; padding: 10px 24px 12px; background: var(--pink); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 0 4px 0 var(--ink); transform: rotate(-2deg); }
  .og-tag { margin-top: 26px; font-size: 26px; font-weight: 700; }
  .og-burst { position: absolute; width: 170px; right: -40px; top: -52px; transform: rotate(14deg); }
  .og-burst text { font-family: var(--f-ui); font-weight: 900; font-size: 17px; fill: #fff; }
</style>
</head>
<body>
<div id="og">
  <div class="og-lid">
    <div>
      <div class="og-badges"><span>1 player</span><span>Ages 18+</span><span>3–5 minutes</span></div>
      <h1 class="og-title" id="og-title">A portfolio<br>you can play</h1>
      <div class="og-ribbon">The Marketing Game</div>
      <p class="og-tag" id="og-tag">Roll the die. Land on the work.</p>
    </div>
    <svg viewBox="0 0 430 330" aria-hidden="true" style="width:360px">
      <ellipse cx="220" cy="312" rx="190" ry="12" fill="#1C1747" opacity=".16"/>
      <g stroke="#1C1747" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
        <g transform="rotate(-15 150 300)">
          <rect x="88" y="90" width="130" height="182" rx="16" fill="#fff"/>
          <path d="M88 106a16 16 0 0 1 16-16h98a16 16 0 0 1 16 16v28H88z" fill="#49A8FF"/>
          <circle cx="153" cy="200" r="30" fill="#FFC22E"/>
        </g>
        <g transform="rotate(15 290 300)">
          <rect x="222" y="90" width="130" height="182" rx="16" fill="#fff"/>
          <path d="M222 106a16 16 0 0 1 16-16h98a16 16 0 0 1 16 16v28H222z" fill="#27CF95"/>
          <path d="M287 172l9 18 20 3-14 14 3 20-18-9-18 9 3-20-14-14 20-3z" fill="#FF7EBE"/>
        </g>
        <g>
          <rect x="155" y="62" width="130" height="182" rx="16" fill="#fff"/>
          <path d="M155 78a16 16 0 0 1 16-16h98a16 16 0 0 1 16 16v28H155z" fill="#FF5A36"/>
          <circle cx="220" cy="172" r="34" fill="#fff"/><circle cx="220" cy="172" r="20" fill="#FF5A36"/><circle cx="220" cy="172" r="7" fill="#1C1747" stroke="none"/>
        </g>
        <g transform="translate(300 170) rotate(14 50 50)">
          <rect x="10" y="12" width="100" height="100" rx="20" fill="#CFC6FF"/>
          <rect x="0" y="0" width="100" height="100" rx="20" fill="#fff"/>
          <g fill="#1C1747" stroke="none"><circle cx="27" cy="27" r="9"/><circle cx="73" cy="27" r="9"/><circle cx="50" cy="50" r="9"/><circle cx="27" cy="73" r="9"/><circle cx="73" cy="73" r="9"/></g>
        </g>
        <g transform="translate(10 150) scale(3)" fill="#1C1747">
          <rect x="5" y="42" width="30" height="7.5" rx="3.75" stroke-width="1.6"/>
          <path d="M11 43.5C11 35.5 14 30.5 17.5 27.5h5C26 30.5 29 35.5 29 43.5Z" stroke-width="1.6"/>
          <rect x="12.5" y="24" width="15" height="5.5" rx="2.75" fill="#FFC22E" stroke-width="1.6"/>
          <circle cx="20" cy="14.5" r="9.5" stroke-width="1.6"/>
          <ellipse cx="16.4" cy="11" rx="3.2" ry="2.2" fill="#fff" opacity=".7" stroke="none"/>
        </g>
      </g>
    </svg>
    <svg class="og-burst" viewBox="0 0 140 140" aria-hidden="true" id="og-burst"></svg>
  </div>
</div>
<script src="../js/content.js"></script>
<script>
  (function () {
    var pts = [], n = 18;
    for (var k = 0; k < n * 2; k++) {
      var r = k % 2 ? 56 : 68, a = Math.PI * k / n - Math.PI / 2;
      pts.push((70 + r * Math.cos(a)).toFixed(1) + ',' + (70 + r * Math.sin(a)).toFixed(1));
    }
    document.getElementById('og-burst').innerHTML =
      '<polygon points="' + pts.join(' ') + '" fill="#FF5A36" stroke="#1C1747" stroke-width="3.5" stroke-linejoin="round"/>' +
      '<text x="70" y="66" text-anchor="middle">Real results</text><text x="70" y="86" text-anchor="middle">inside!</text>';
    var P = (window.PORTFOLIO || {}).person;
    if (/named/.test(location.search) && P) {
      document.getElementById('og-title').textContent = P.name;
      document.getElementById('og-tag').textContent = P.role + (P.location ? ', ' + P.location.split(',')[0] : '');
    }
  })();
</script>
</body>
</html>
